name: CI/CD API scoring crédit

# tests -> construction de l'image Docker (si tests OK) -> déploiement (si image OK, branche master)
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests unitaires et d'intégration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-*.txt

      - name: Installation des dépendances
        run: pip install -r requirements-dev.txt

      # Couverture mesurée sur api/ et monitoring/ (cf. pyproject.toml) : sous 85 %,
      # le job échoue et l'image n'est pas construite.
      - name: Tests (modèle + API) et couverture
        env:
          GRADIO_ANALYTICS_ENABLED: "False"
        run: |
          python -m pytest tests -v --junitxml=rapport-tests.xml \
            --cov --cov-report=term --cov-report=xml:coverage.xml --cov-report=html:htmlcov

      - name: Couverture dans le résumé du job
        if: always()
        run: |
          {
            echo "## Couverture des tests"
            echo ""
            python -m coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publication des rapports de tests et de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests
          path: |
            rapport-tests.xml
            coverage.xml
            htmlcov/

  build:
    name: Construction de l'image Docker
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.nom }}
    steps:
      - uses: actions/checkout@v5

      - name: Nom de l'image (GHCR exige des minuscules)
        id: image
        run: echo "nom=ghcr.io/${GITHUB_REPOSITORY,,}-api" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Construction
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.image.outputs.nom }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Secret GitHub s'il existe, sinon clé éphémère valable le temps du job : jamais
      # de clé en clair dans le dépôt, et l'API n'est jamais démarrée sans clé.
      - name: Clé d'API du conteneur de test
        env:
          API_KEY_SECRET: ${{ secrets.API_KEY }}
        run: |
          CLE="${API_KEY_SECRET:-$(openssl rand -hex 32)}"
          echo "::add-mask::$CLE"
          echo "API_KEY=$CLE" >> "$GITHUB_ENV"

      - name: Vérification de l'image construite
        run: |
          docker run -d --name api-test -e API_KEY="$API_KEY" -p 8000:8000 \
            "${{ steps.image.outputs.nom }}:${{ github.sha }}"
          python3 scripts/smoke_test.py http://localhost:8000

      - name: Logs du conteneur
        if: failure()
        run: docker logs api-test

      - name: Connexion au GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publication de l'image
        if: github.event_name != 'pull_request'
        run: |
          IMAGE="${{ steps.image.outputs.nom }}"
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  deploy:
    name: Déploiement
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment: production
    env:
      IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - name: Connexion au GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # L'API consomme ~325 Mo de RSS et l'image 240 Mo compressés : on refuse de
      # déployer sur un hôte qui ne peut pas la tenir, plutôt que de la voir tomber
      # sous charge (OOM) une fois en service.
      - name: Vérification des ressources de l'environnement cible
        run: |
          echo "CPU : $(nproc) | $(free -h | awk '/^Mem:/{print "RAM totale " $2 ", disponible " $7}')"
          df -h / | tail -1
          MEMOIRE_MO=$(free -m | awk '/^Mem:/{print $7}')
          DISQUE_MO=$(df -m --output=avail / | tail -1)
          test "$MEMOIRE_MO" -ge 1024 || { echo "Mémoire disponible insuffisante : ${MEMOIRE_MO} Mo < 1024 Mo"; exit 1; }
          test "$DISQUE_MO" -ge 2048 || { echo "Espace disque insuffisant : ${DISQUE_MO} Mo < 2048 Mo"; exit 1; }

      # La clé du déploiement vient du secret GitHub ; à défaut, une clé éphémère est
      # tirée pour ce job. Elle n'apparaît ni dans le dépôt ni dans les logs (masquée).
      - name: Clé d'API de l'API déployée
        env:
          API_KEY_SECRET: ${{ secrets.API_KEY }}
        run: |
          if [ -n "$API_KEY_SECRET" ]; then
            echo "Clé d'API issue du secret GitHub API_KEY."
            CLE="$API_KEY_SECRET"
          else
            echo "Secret API_KEY absent : clé éphémère générée pour ce déploiement."
            CLE="$(openssl rand -hex 32)"
          fi
          echo "::add-mask::$CLE"
          echo "API_KEY=$CLE" >> "$GITHUB_ENV"

      # Environnement cible simulé : l'hôte du runner joue le rôle du serveur de
      # production. L'image est tirée du registry, comme sur un vrai serveur.
      - name: Récupération de l'image depuis le registry
        run: docker pull "$IMAGE"

      - name: Lancement du conteneur
        run: |
          docker run -d --name api-scoring --restart unless-stopped \
            -e API_KEY="$API_KEY" --memory=1g --cpus=1 -p 8000:8000 "$IMAGE"

      # Le test de fumée vérifie aussi le temps de réponse (p95 de /predict sous
      # SMOKE_P95_MAX_MS) : une régression de performance bloque le déploiement.
      - name: Test de fumée de l'API déployée
        run: python3 scripts/smoke_test.py http://localhost:8000 | tee smoke-test.txt

      - name: Consommation réelle du conteneur
        run: docker stats --no-stream api-scoring

      - name: Logs du conteneur
        if: always()
        run: docker logs api-scoring

      - name: Résumé du déploiement
        run: |
          {
            echo "## API de scoring déployée"
            echo ""
            echo "- Image : \`$IMAGE\`"
            echo "- Santé : \`$(curl -s http://localhost:8000/health)\`"
            echo "- $(grep 'Latence /predict' smoke-test.txt)"
            echo "- Endpoints : \`POST /predict\`, \`GET /model\`, \`GET /docs\`, interface Gradio sur \`/ui\`"
          } >> "$GITHUB_STEP_SUMMARY"
