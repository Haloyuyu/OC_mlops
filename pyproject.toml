[project]
name = "projet6-mlops"
version = "0.1.0"
description = ""
authors = [
    {name = "Amaury",email = "amaurygauthier31@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "numpy (>=2.5.1,<3.0.0)",
    "pandas (>=2.3.0,<3.0.0)",
    "matplotlib (>=3.11.0,<4.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "lightgbm (>=4.7.0,<5.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "mlflow (>=3.14.0,<4.0.0)",
    "optuna (>=4.9.0,<5.0.0)",
    "requests (>=2.32.0,<3.0.0)",
    "gradio (>=6.27.0,<7.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.3.0,<8.0.0)",
    "missingno (>=0.5.2,<0.6.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
